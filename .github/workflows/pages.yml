name: Hash check page

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On the hourly schedule, rebuild only when Adobe's registry differs from the one
  # the live page was built from. Pushes and manual runs always rebuild, as does
  # any failure to read either side, so a problem surfaces in the build.
  changes:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
    steps:
      - id: compare
        env:
          PAGE_URL: https://deployecommerce.github.io/magento-community-patches/status.json
          REGISTRY_URL: https://repo.magento.com/patch/patch-registry.json
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          built=$(curl -fsS "$PAGE_URL" | jq -r '.registry_sha256 // empty') || built=
          current=$(curl -fsS --max-redirs 0 "$REGISTRY_URL" | sha256sum | cut -d' ' -f1) || current=
          echo "Live page built from registry: ${built:-unknown}"
          echo "Current registry:               ${current:-unknown}"
          if [ -n "$built" ] && [ "$built" = "$current" ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    outputs:
      all-match: ${{ steps.check.outputs.all-match }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Compare every patch with Adobe's registry
        id: check
        run: |
          set +e
          tools/bin/status-page site | tee check-report.txt
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0) echo "all-match=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "all-match=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      - name: Open or update an issue on any mismatch
        if: steps.check.outputs.all-match == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Patch hash check failed
        run: |
          body=$(printf 'The scheduled hash check found patches that no longer match Adobe'"'"'s registry.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' "$(cat check-report.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Fail the run if any patch did not match
        if: needs.build.outputs.all-match == 'false'
        run: |
          echo "At least one patch does not match Adobe's registry; the page shows which." >&2
          exit 1
