name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  verify:
    name: Verify patches against Adobe's registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Check every .sha256 file
        working-directory: patches
        run: sha256sum -c ./*.sha256
      - run: tools/bin/verify

  releases:
    name: List releases to apply-test
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.list.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        # Every release a monthly patch ships for, plus one release per other patch.
        run: |
          releases=$(jq -c '[.patches[] | if (.id | test("-[0-9]{4}-[0-9]{2}-[0-9]{3}-CE$")) then .applies_to[] else .applies_to[0] end] | unique' patches.json)
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  apply-test:
    name: Apply to Magento Open Source ${{ matrix.release }}
    needs: releases
    if: needs.releases.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.releases.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mcp-mirror
          key: mirror-${{ matrix.release }}
      - run: tools/bin/apply-test "${{ matrix.release }}"
        env:
          MCP_MIRROR_CACHE: ${{ runner.temp }}/mcp-mirror

  # The single check branch protection requires; the apply-test job names change with the patch set.
  ci-passed:
    name: CI passed
    if: always()
    needs: [tests, verify, releases, apply-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

