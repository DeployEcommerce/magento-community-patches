name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  verify:
    name: Verify patches against Adobe's registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Check every .sha256 file
        working-directory: patches
        run: sha256sum -c ./*.sha256
      - run: tools/bin/verify

  releases:
    name: List releases to apply-test
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.list.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Every release a monthly patch ships for, plus one release per other patch.
        run: |
          releases=$(jq -c '[.patches[] | if (.id | test("-[0-9]{4}-[0-9]{2}-[0-9]{3}-CE$")) then .applies_to[] else .applies_to[0] end] | unique' patches.json)
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  apply-test:
    name: Apply to Magento Open Source ${{ matrix.release }}
    needs: releases
    if: needs.releases.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.releases.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mcp-mirror
          key: mirror-${{ matrix.release }}
      - run: tools/bin/apply-test "${{ matrix.release }}"
        env:
          MCP_MIRROR_CACHE: ${{ runner.temp }}/mcp-mirror
