name: Sync with Adobe's patch registry

on:
  schedule:
    # Every 15 minutes, off the quarter hour, where scheduled runs queue longest.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  # Runs Composer and the sync. Holds no token that can write to the repository.
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Sync patches/ and patches.json
        id: sync
        run: |
          set +e
          tools/bin/sync > sync-report.txt
          code=$?
          set -e
          cat sync-report.txt
          case "$code" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      - name: Build pull request body
        if: steps.sync.outputs.changed == 'true'
        run: |
          {
            echo "Automated sync with [Adobe's patch registry](https://repo.magento.com/patch/patch-registry.json)."
            echo
            echo "Every added patch passed every shipping check: Magento Open Source area, no entitlement, public download (HTTP 200, no redirect), sha256 equal to the registry, only Magento Open Source files changed, and every prerequisite shippable."
            echo
            if grep -q '^reissued ' sync-report.txt; then
              echo "**Adobe re-issued at least one patch already shipped under the same id.** The version we shipped before is kept in \`patches/superseded/\`; compare it with the new file before merging."
              echo
            fi
            echo '```'
            cat sync-report.txt
            echo '```'
            echo
            echo "Review before merging: merging publishes a release."
          } > pr-body.md
      - if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync
          path: |
            patches/
            patches.json
            pr-body.md
          if-no-files-found: error
          retention-days: 3

  # Opens the pull request. Runs no PHP and installs no dependencies, so the token
  # never shares a job with third-party code.
  pull-request:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # The sync app's token does the writing, so GITHUB_TOKEN only needs to read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync
          path: ${{ runner.temp }}/sync
      - name: Take only the files a sync produces
        env:
          SYNC: ${{ runner.temp }}/sync
        run: |
          rm -f patches/*.patch patches/*.patch.sha256
          find "$SYNC/patches" -type f | while read -r file; do
            path=${file#"$SYNC/patches/"}
            case "$path" in
              .gitkeep) ;;
              superseded/*)
                if ! printf '%s' "$path" | grep -Eq '^superseded/[0-9A-Za-z.-]+-CE\.[0-9a-f]{12}\.patch(\.sha256)?$'; then
                  echo "Unexpected file name: $path" >&2
                  exit 1
                fi
                mkdir -p patches/superseded
                cp "$file" "patches/$path"
                ;;
              *.patch|*.patch.sha256)
                if ! printf '%s' "$path" | grep -Eq '^[0-9A-Za-z.-]+-CE\.patch(\.sha256)?$'; then
                  echo "Unexpected file name: $path" >&2
                  exit 1
                fi
                cp "$file" "patches/$path"
                ;;
              *) echo "Unexpected file: $path" >&2; exit 1 ;;
            esac
          done
          cp "$SYNC/patches.json" patches.json
          cp "$SYNC/pr-body.md" "$RUNNER_TEMP/pr-body.md"
      - name: Create a token for the sync app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A token other than GITHUB_TOKEN, so CI runs on the pull request. It belongs
          # to the sync app, which cannot bypass branch protection, and expires after an hour.
          token: ${{ steps.app-token.outputs.token }}
          branch: sync/adobe-patch-registry
          delete-branch: true
          add-paths: |
            patches/
            patches.json
          commit-message: 'feat(patches): sync with Adobe patch registry'
          title: 'feat(patches): sync with Adobe patch registry'
          body-path: ${{ runner.temp }}/pr-body.md
